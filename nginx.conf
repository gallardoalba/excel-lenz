# ═══════════════════════════════════════════════════════════
# Excel-lenz — Nginx Reverse Proxy
# ═══════════════════════════════════════════════════════════

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

    # ── AI Scraper blocking by User-Agent ───────────────────
    # Returns 403 before any request reaches the app.
    # Covers scrapers that ignore robots.txt.
    map $http_user_agent $block_scraper {
        default 0;

        # OpenAI
        "~*GPTBot"              1;
        "~*ChatGPT-User"        1;

        # Anthropic
        "~*anthropic-ai"        1;
        "~*Claude-Web"          1;
        "~*claude"              1;

        # Common Crawl (AI training)
        "~*CCBot"               1;

        # Google AI
        "~*Google-Extended"     1;
        "~*GoogleOther"         1;

        # Meta
        "~*FacebookBot"         1;
        "~*Meta-ExternalAgent"  1;

        # ByteDance
        "~*Bytespider"          1;

        # Perplexity
        "~*PerplexityBot"       1;

        # Cohere
        "~*cohere-ai"           1;

        # Other AI crawlers
        "~*Omgilibot"           1;
        "~*Omgili"              1;
        "~*YouBot"              1;
        "~*Diffbot"             1;
        "~*ImagesiftBot"        1;
        "~*PetalBot"            1;
        "~*Amazonbot"           1;
        "~*Applebot-Extended"   1;
        "~*AhrefsBot"           1;
        "~*SemrushBot"          1;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Content Security Policy — tighten in production
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'" always;

    # HTTPS redirect
    server {
        listen 80;
        server_name _;
        if ($block_scraper) { return 403; }
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl http2;
        ssl_certificate /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        server_name _;

        # HSTS
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Block AI scrapers at the gate (before any location block)
        if ($block_scraper) {
            return 403;
        }

        # Health check
        location /api/health {
            proxy_pass http://api:3001;
            proxy_http_version 1.1;
        }

        # API — rate limited
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://api:3001;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # Login — strict rate limit
        location /api/auth/login {
            limit_req zone=login burst=3 nodelay;
            proxy_pass http://api:3001;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Frontend SPA
        location / {
            root /app/public;
            try_files $uri $uri/ /index.html;
            index index.html;

            # Cache static assets
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
                expires 30d;
                add_header Cache-Control "public, immutable";
                # Re-declare security headers (child location overrides parent add_header)
                add_header X-Frame-Options "SAMEORIGIN" always;
                add_header X-Content-Type-Options "nosniff" always;
                add_header X-XSS-Protection "1; mode=block" always;
                add_header Referrer-Policy "strict-origin-when-cross-origin" always;
                add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'" always;
            }
        }
    }
}
