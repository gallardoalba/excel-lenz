name: CI — Excel-lenz

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: cd backend && npm ci

      - name: Run tests
        run: cd backend && npm test
        env:
          JWT_SECRET: ci-test-secret
          DB_PATH: ':memory:'
          SEED_PASSWORD: ci-test-password

      - name: Type check
        run: cd backend && npx tsc --noEmit

  frontend-typecheck:
    name: Frontend Type Check + Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Type check
        run: cd frontend && npx tsc --noEmit

      - name: Build
        run: cd frontend && npm run build

      - name: Audit dependencies
        run: cd frontend && npm audit --audit-level=high
        continue-on-error: true

  backend-audit:
    name: Backend Security Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
        continue-on-error: true

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-typecheck]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install root dependencies
        run: npm ci

      - name: Install backend dependencies
        run: cd backend && npm ci

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Install Playwright browsers
        run: cd frontend && npx playwright install --with-deps chromium

      - name: Seed database
        run: mkdir -p backend/data && cd backend && JWT_SECRET=ci-secret SEED_PASSWORD=ci-pass DB_PATH=./data/excel-lenz.db npx tsx src/db/seed.ts

      - name: Start backend
        run: cd backend && JWT_SECRET=ci-secret DB_PATH=./data/excel-lenz.db NODE_ENV=test npx tsx src/server.ts &
        env:
          JWT_SECRET: ci-secret
          NODE_ENV: test

      - name: Start frontend
        run: cd frontend && npx vite --host &

      - name: Wait for servers
        run: npx wait-on http://localhost:3001/api/courses http://localhost:5173

      - name: Run Playwright tests
        run: cd frontend && npx playwright test

      - name: Upload Playwright report (on failure)
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7