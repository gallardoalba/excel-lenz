name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: cd backend && npm ci

      - name: Run tests
        run: cd backend && npm test
        env:
          JWT_SECRET: ci-test-secret
          DB_PATH: ':memory:'
          SEED_PASSWORD: ci-test-password

      - name: Type check
        run: cd backend && npx tsc --noEmit

  frontend-typecheck:
    name: Frontend Type Check + Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Type check
        run: cd frontend && npx tsc --noEmit

      - name: Build
        run: cd frontend && npm run build

      - name: Audit dependencies
        run: cd frontend && npm audit --audit-level=high
        continue-on-error: true

  backend-audit:
    name: Backend Security Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
        continue-on-error: true

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-typecheck]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install root dependencies
        run: npm ci

      - name: Install backend dependencies
        run: cd backend && npm ci

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Install Playwright browsers
        run: cd frontend && npx playwright install --with-deps chromium

      - name: Seed database
        run: mkdir -p backend/data && cd backend && JWT_SECRET=ci-secret SEED_PASSWORD=ci-test-password DB_PATH=./data/excel-lenz.db npx tsx src/db/seed.ts

      - name: Start backend
        run: cd backend && JWT_SECRET=ci-secret DB_PATH=./data/excel-lenz.db NODE_ENV=test npx tsx src/server.ts &
        env:
          JWT_SECRET: ci-secret
          NODE_ENV: test

      - name: Start frontend
        run: cd frontend && npx vite --host &

      - name: Wait for servers
        run: npx wait-on http://localhost:3001/api/courses http://localhost:5173

      - name: Run Playwright tests
        run: cd frontend && npx playwright test
        env:
          SEED_PASSWORD: ci-test-password

      - name: Upload Playwright report (on failure)
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  docker-test:
    name: Docker Build & Smoke Test
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-typecheck]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: excel-lenz:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate docker-compose.yml syntax
        run: docker compose -f docker-compose.yml config

      - name: Start container and test health endpoint
        run: |
          docker run -d --name excel-lenz-test \
            -p 3001:3001 \
            -e JWT_SECRET=ci-test-secret \
            -e NODE_ENV=test \
            excel-lenz:ci-test

          # Wait for health check to pass (max 60s)
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3001/api/health; then
              echo "✅ Container healthy after ${i}s"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "❌ Container failed to become healthy"
              docker logs excel-lenz-test
              exit 1
            fi
            sleep 2
          done

      - name: Test API endpoint
        run: |
          curl -sf http://localhost:3001/api/courses | head -c 100
          echo ""
          echo "✅ API responding"

      - name: Cleanup
        if: always()
        run: docker rm -f excel-lenz-test || true