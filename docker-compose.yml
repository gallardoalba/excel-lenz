# ═══════════════════════════════════════════════════════════
# Excel-lenz — Docker Compose (Production)
# ═══════════════════════════════════════════════════════════
#
# NOTE: The backend currently uses SQLite via better-sqlite3.

services:
  # ── Backend API ─────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: excel-lenz-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DB_PATH: /app/data/excel-lenz.db
      JWT_SECRET: ${JWT_SECRET}
    volumes:
      - appdata:/app/data
    expose:
      - '3001'  # Only accessible within Docker network via nginx
    healthcheck:
      test: ['CMD', 'node', '-e', "require('http').get('http://localhost:3001/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── Nginx Reverse Proxy ────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: excel-lenz-nginx
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      # Mount frontend build from host (built before `docker compose up`)
      - ./frontend/dist:/app/public:ro
      - /etc/letsencrypt/live/excel-lenz.com/fullchain.pem:/etc/nginx/certs/fullchain.pem:ro
      - /etc/letsencrypt/live/excel-lenz.com/privkey.pem:/etc/nginx/certs/privkey.pem:ro
      - nginx_logs:/var/log/nginx
    ports:
      - '80:80'
      - '443:443'
    depends_on:
      api:
        condition: service_healthy

volumes:
  appdata:
  nginx_logs:
