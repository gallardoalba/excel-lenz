# ═══════════════════════════════════════════════════════════
# Excel-lenz — Docker Compose (Production)
# ═══════════════════════════════════════════════════════════
#
# NOTE: The backend currently uses SQLite via better-sqlite3.
# The DB_PATH volume persists the database file.
# PostgreSQL migration is planned for v2.0 — see docs/DEPLOYMENT.md.

version: '3.8'

services:
  # ── Backend API ─────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: excel-lenz-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DB_PATH: /app/data/excel-lenz.db
      JWT_SECRET: ${JWT_SECRET}
    volumes:
      - appdata:/app/data
    ports:
      - '3001:3001'

  # ── Nginx Reverse Proxy ────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: excel-lenz-nginx
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - '80:80'
      - '443:443'
    depends_on:
      - api

volumes:
  appdata:
