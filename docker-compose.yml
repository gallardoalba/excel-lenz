# ═══════════════════════════════════════════════════════════
# Excel-lenz — Docker Compose (Production)
# ═══════════════════════════════════════════════════════════

version: '3.8'

services:
  # ── PostgreSQL (replaces SQLite for production) ────────
  db:
    image: postgres:16-alpine
    container_name: excel-lenz-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: excel-lenz
      POSTGRES_USER: excel-lenz
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U excel-lenz']
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend API ─────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: excel-lenz-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DB_TYPE: ${DB_TYPE:-sqlite}
      DB_PATH: /app/data/excel-lenz.db
      DATABASE_URL: ${DATABASE_URL:-}
      JWT_SECRET: ${JWT_SECRET}
    volumes:
      - appdata:/app/data
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '3001:3001'

  # ── Nginx Reverse Proxy ────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: excel-lenz-nginx
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - '80:80'
      - '443:443'
    depends_on:
      - api

volumes:
  pgdata:
  appdata:
